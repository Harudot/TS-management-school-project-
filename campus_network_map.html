      fill:"#F9F8F6",stroke:"#B4B2A9",strokeWidth:"0.5"})),

    // uplinks

      h("line",{x1:u.x,y1:0,x2:u.x,y2:fl.vh,stroke:"#378ADD",strokeWidth:"1",strokeDasharray:"5,4",opacity:"0.5"}),

      h("text",{x:u.x,y:13,textAnchor:"middle",fill:"#0C447C",fontSize:"7.5",fontFamily:"monospace"},u.lb)
    )),

    // rooms
    fl.rooms.map(r=>{
      const c=RT[r.t]||RT.office, iS=sel&&sel.id===r.id;
      return h("g",{key:r.id,className:"rm",onClick:()=>pick("r",r.id)},

          fontSize:"8.5",fontWeight:"500",fontFamily:"monospace"},r.id),
        r.h>35&&h("text",{x:r.x+4,y:r.y+23,fill:iS?"#185FA5":c.t,
          fontSize:"7.5",opacity:"0.85"},r.n.length>14?r.n.slice(0,13)+"…":r.n)
      );
    }),

    // devices
    fl.devices.map(d=>{
      const c=DT[d.t]||DT.switch, iS=sel&&sel.id===d.id, r=d.t==="ap"?13:10;
      return h("g",{key:d.id,className:"dv",onClick:()=>pick("d",d.id)},

        h("circle",{cx:d.x,cy:d.y,r,fill:iS?c.s:c.f,stroke:c.s,strokeWidth:iS?"2":"1.2"}),

      h("p",{style:{fontSize:"11px",color:"var(--color-text-secondary)",margin:0}},`${fl.label} · ${fl.sub}`)
    ),
    sD && h("div",null,
      h("p",{style:{fontSize:"10px",color:"var(--color-text-tertiary)",margin:"0 0 3px",
        letterSpacing:"0.5px",textTransform:"uppercase"}},"Network device"),
      h("p",{style:{fontSize:"22px",fontWeight:500,margin:"0 0 10px",
        color:"var(--color-text-primary)"}},sD.lb),
      ...([
        {l:"Model",v:sD.m,mono:true},
        {l:"Type",v:(DT[sD.t]||DT.switch).l},
        {l:"Floor",v:fl.label},
        {l:"Status",v:"Online",ok:true},
      ].map(row=>h("div",{key:row.l,style:{
        display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:"6px",
        padding:"6px 0",borderBottom:"0.5px solid var(--color-border-tertiary)"}},
        h("span",{style:{fontSize:"11px",color:"var(--color-text-secondary)",flexShrink:0}},row.l),
        h("span",{style:{fontSize:"11px",fontWeight:500,textAlign:"right",
          color:row.ok?"var(--color-text-success)":"var(--color-text-primary)",
          fontFamily:row.mono?"var(--font-mono)":"inherit"}},row.v)
      )))
    ),
    h("button",{className:"dismiss-btn",onClick:()=>setSel(null)},"Dismiss")
  );

  return h("div",{style:{fontFamily:"var(--font-sans)"}},
    h("span",{className:"sr-only"},`Campus map — ${fl.label}`),

    h("div",{style:{display:"flex",alignItems:"center",flexWrap:"wrap",gap:"8px",
      paddingBottom:"10px",borderBottom:"0.5px solid var(--color-border-tertiary)",marginBottom:"10px"}},
      h("div",null,
        h("p",{style:{fontSize:"17px",fontWeight:500,margin:0,color:"var(--color-text-primary)"}},"Campus map"),
        h("p",{style:{fontSize:"12px",color:"var(--color-text-secondary)",margin:0}},"Хичзэлийн I байр — click rooms or devices")
      ),
      h("div",{style:{marginLeft:"auto",display:"flex",gap:"6px"}},
        ...[{v:fl.rooms.length,l:"rooms",c:"var(--color-text-secondary)"},
            {v:aps,l:"APs",c:"#0F6E56"},
            {v:sws,l:"switches",c:"#854F0B"}].map(s=>
          h("div",{key:s.l,style:{background:"var(--color-background-secondary)",
            borderRadius:"var(--border-radius-md)",padding:"5px 10px",textAlign:"center",minWidth:"52px"}},
            h("div",{style:{fontSize:"17px",fontWeight:500,color:s.c,lineHeight:1}},s.v),
            h("div",{style:{fontSize:"11px",color:"var(--color-text-secondary)",marginTop:"2px"}},s.l)
          )
        )
      )
    ),

    h("div",{style:{display:"flex",gap:"4px",marginBottom:"10px",flexWrap:"wrap"}},
      ...FLOORS.map(f=>h("button",{key:f.id,className:"ftab",onClick:()=>{setFid(f.id);setSel(null);},
        style:{border:`0.5px solid ${fid===f.id?"var(--color-border-info)":"var(--color-border-secondary)"}`,
          background:fid===f.id?"var(--color-background-info)":"transparent",
          color:fid===f.id?"var(--color-text-info)":"var(--color-text-secondary)",
          fontWeight:fid===f.id?500:400}},f.label)),
      h("span",{style:{marginLeft:"auto",fontSize:"11px",color:"var(--color-text-tertiary)",
        alignSelf:"center"}},fl.sub)
    ),

    h("div",{style:{display:"flex",gap:"10px",alignItems:"flex-start"}},
      h("div",{style:{flex:1,minWidth:0,background:"var(--color-background-secondary)",
        borderRadius:"var(--border-radius-lg)",border:"0.5px solid var(--color-border-tertiary)",
        padding:"10px",overflowX:"auto"}},
        svgMap, legend
      ),
      panel
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
